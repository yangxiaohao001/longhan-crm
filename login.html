<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 龙瀚 CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="nav-brand-logo" data-icon="hex-nut"></span>
        <b>龙瀚 CRM</b>
        <i>LONGHAN METAL · 拉弯智控</i>
      </div>
      <div id="userList"></div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:0 12px;margin-top:10px">
        <div class="form-item"><label>账号</label><input class="input" id="userInput" placeholder="登录名 / 手机号"></div>
        <div class="form-item"><label>密码</label><input class="input" type="password" id="pwdInput" placeholder="admin123" autocomplete="current-password"></div>
      </div>
      <p class="form-error" id="pwdErr" style="margin-top:6px"></p>
      <button class="btn btn-primary btn-lg" id="loginBtn" style="width:100%">登 录</button>
      <p class="login-tip">河北龙瀚金属制品有限公司 · 客户管理系统<br>默认账号 admin / 密码 admin123</p>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/perm.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
